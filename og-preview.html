<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSP 2026 — Open Graph Preview</title>
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('./node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2')
          format('woff2');
        font-style: normal;
        font-weight: 200 800;
      }

      :root {
        color-scheme: dark;
        font-family: 'Bricolage Grotesque', Inter, Arial, sans-serif;
        background: #060708;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 1200px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #060708;
      }

      .og-card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d0d0d;
        color: #f9f9f9;
      }

      .brand {
        position: absolute;
        top: 52px;
        left: 60px;
      }

      .brand img {
        display: block;
        width: 248px;
        height: auto;
      }

      .content {
        position: absolute;
        top: 205px;
        left: 60px;
        width: 660px;
      }

      .label {
        margin: 0 0 20px;
        color: #8dd0ff;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #f9f9f9;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.96;
      }

      .speaker {
        position: absolute;
        right: 34px;
        bottom: 0;
        width: 420px;
        text-align: center;
      }

      .speaker img {
        display: block;
        width: 100%;
        height: 460px;
        object-fit: contain;
        object-position: center bottom;
      }

      .speaker-name {
        position: absolute;
        right: 0;
        bottom: 36px;
        left: 0;
        margin: 0;
        display: block;
        color: #f9f9f9;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 18px #000;
      }
    </style>
  </head>
  <body>
    <main class="og-card" aria-label="DSP 2026 Open Graph image preview">
      <div class="brand">
        <img src="./src/assets/acm-vit-logo.svg" alt="ACM VIT Student Chapter" />
      </div>

      <section class="content">
        <p class="label">Distinguished Speaker Program</p>
        <h1>Building advanced AI applications &amp; agents</h1>
      </section>

      <section class="speaker" aria-label="Featured speaker">
        <img src="./src/assets/speaker-mehdi-bahrami.png" alt="Mehdi Bahrami" />
        <p class="speaker-name">Mehdi Bahrami</p>
      </section>
    </main>
  </body>
</html>
